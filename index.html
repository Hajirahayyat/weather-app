<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather App</title>
 <link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Baloo+2:wght@600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="appScale">
    <div class="app-shell">
      <div id="weatherEffects" class="weather-effects"></div>

      <header class="app-header">
        <div class="header-icon-small">
          <svg viewBox="0 0 140 110" width="130" height="102">
            <circle cx="70" cy="42" r="34" fill="#FFC93C" opacity="0.2"/>
            <g stroke="#FFC93C" stroke-width="4" stroke-linecap="round">
              <line x1="70" y1="4" x2="70" y2="14"/>
              <line x1="34" y1="18" x2="42" y2="26"/>
              <line x1="106" y1="18" x2="98" y2="26"/>
              <line x1="18" y1="45" x2="28" y2="45"/>
              <line x1="122" y1="45" x2="112" y2="45"/>
              <line x1="26" y1="70" x2="35" y2="63"/>
            </g>
            <circle cx="70" cy="42" r="24" fill="#FFC93C"/>
            <path d="M96 22h13a6 6 0 1 1 1.3 11.9A7 7 0 0 1 98 24Z" fill="#ffffff" opacity="0.9"/>
            <path d="M88 92H36a19 19 0 1 1 4-37.5A22.5 22.5 0 0 1 92 65a15.5 15.5 0 0 1-4 27Z" fill="#ffffff"/>
          </svg>
        </div>
        <h1 class="side-title">Weather<br><span class="accent-word">App</span></h1>
        <p id="quoteText" class="side-quote">🌤️ Every sky tells a story.</p>
      </header>

      <div class="app-container">
        <main>
          <div class="app-card">
            <div class="search-box">
              <div class="search-input-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="7"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="cityInput" placeholder="Enter city name..." />
              </div>
              <button id="searchBtn">
                Search
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                  <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
              </button>
              <button id="locationBtn">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                  <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
                </svg>
                Use My Location
              </button>
            </div>

            <div id="errorMsg" class="error-message hidden"></div>

            <div id="weatherResult" class="weather-result hidden">
              <div class="location-row">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff">
                  <path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/>
                </svg>
                <div>
                  <h2 id="cityName"></h2>
                  <p id="countryName"></p>
                </div>
              </div>

              <div class="weather-main-row">
                <div class="weather-icon" id="weatherIcon"></div>
                <p class="temperature" id="temperature"></p>
              </div>

              <p class="condition" id="condition"></p>

              <div class="divider-fancy"><span></span></div>

              <div class="stats-row">
                <div class="stat">
                  <svg class="stat-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 2s6 7 6 12a6 6 0 0 1-12 0c0-5 6-12 6-12z"></path>
                  </svg>
                  <span class="stat-label">Humidity</span>
                  <span class="stat-value" id="humidity"></span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat">
                  <svg class="stat-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <path d="M3 8h9a3 3 0 1 0-3-3"></path>
                    <path d="M3 16h13a3 3 0 1 1-3 3"></path>
                  </svg>
                  <span class="stat-label">Wind</span>
                  <span class="stat-value" id="wind"></span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat">
                  <svg class="stat-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.2" y1="4.2" x2="5.6" y2="5.6"></line>
                    <line x1="18.4" y1="18.4" x2="19.8" y2="19.8"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.2" y1="19.8" x2="5.6" y2="18.4"></line>
                    <line x1="18.4" y1="5.6" x2="19.8" y2="4.2"></line>
                  </svg>
                  <span class="stat-label">UV Index</span>
                  <span class="stat-value" id="uvIndex"></span>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
